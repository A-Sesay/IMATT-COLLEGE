<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMATT College ERP Dashboard</title>
        <link rel="icon" type="image/png" href="IC.png" />
    <link rel="apple-touch-icon" href="IC.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  </head>
  <body class="dashboard-page">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark small">
            <img src="IC.png" alt="IMATT College logo" class="brand-icon" />
          </div>
          <div>
            <strong>IMATT</strong>
            <small>COLLEGE</small>
          </div>
        </div>

        <nav class="side-nav">
          <a class="nav-item active" href="#" data-menu="overview">Overview</a>
          <a class="nav-item" href="#" data-menu="students">Students</a>
          <a class="nav-item" href="#" data-menu="staff">Staff</a>
          <a class="nav-item" href="#" data-menu="academics">Academics</a>
          <a class="nav-item" href="#" data-menu="finance">Finance</a>
          <a class="nav-item" href="#" data-menu="exams">Exams</a>
          <a class="nav-item" href="#" data-menu="reports">Reports</a>
          <a class="nav-item" href="#" data-menu="users">Users</a>
          <a class="nav-item" href="#" data-menu="chat">Chat</a>
          <a class="nav-item" href="#" data-menu="settings">Settings</a>
        </nav>

        <div class="role-panel">
          <small>Active account</small>
          <strong id="roleBadge">Administrator</strong>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p>Welcome back</p>
            <h1 id="dashboardTitle">Administrator Dashboard</h1>
          </div>

          <div class="topbar-actions">
            <div class="search-box">Search</div>
            <button id="logoutBtn" class="ghost-btn">Log out</button>
          </div>
        </header>

        <section id="roleSummary" class="role-summary"></section>

        <section id="modulePanel" class="module-panel"></section>

        <section class="stats-grid" id="statsGrid"></section>

        <section class="content-grid">
          <div class="panel card">
            <div class="panel-header">
              <h3>Quick actions</h3>
              <span class="badge neutral">Today</span>
            </div>
            <ul id="quickActions" class="list-group"></ul>
          </div>

          <div class="panel card">
            <div class="panel-header">
              <h3>Recent activity</h3>
              <span class="badge success">Live</span>
            </div>
            <ul id="activityList" class="list-group compact"></ul>
          </div>
        </section>

        <section class="panel card wide-panel">
          <div class="panel-header">
            <h3>Operational Overview</h3>
            <span class="badge info">This term</span>
          </div>
          <div id="chartBars" class="chart-bars"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
