<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMATT College | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="IC.png" />
    <link rel="apple-touch-icon" href="IC.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-visual" aria-label="IMATT College building preview">
        <div class="visual-content">
          <div class="college-header">
            <div class="college-mark">
              <img src="IC.png" alt="IMATT College logo" class="c-mark" width="50" height="60" />
            </div>
            <div class="college-name-wrap">
              <div class="college-name">
                <strong>IMATT</strong>
                <span>COLLEGE</span>
              </div>
              <span class="college-small">EDUCATION IS THE SOURCE OF HUMAN PROGRESS</span>
            </div>
          </div>

          <img src="1.jpg" alt="College building illustration" class="building-scene" />
        </div>
      </section>

      <section class="login-panel" aria-label="IMATT College login panel">
        <div class="login-card">
          <div class="college-logo-wrap">
            <img src="i.c.png" alt="IMATT College logo" class="college-logo" />
          </div>

          <h1 class="college-title">IMATT COLLEGE</h1>
          <p class="tagline">"Education is the source of human progress"</p>

          <form id="loginForm" class="login-form">
            <label class="field" aria-label="username or email">
              <span class="field-icon">✉</span>
              <input id="loginEmail" type="email" value="abdulaisesay167@gmail.com" placeholder="Enter your username or email" />
            </label>

            <label class="field password-field" aria-label="Password">
              <span class="field-icon">🔒</span>
              <input id="loginPassword" type="password" value="Mexcess25132513" placeholder="Password" />
            </label>

            <div class="helper-row">
              <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="primary-btn">
              <span>Sign in to Portal</span>
              <span class="arrow">→</span>
            </button>
          </form>

          <p class="affiliation">
            Affiliated with <strong>University of Sierra Leone-</strong><br />
            FBC,IPAM,COHMAS
          </p>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
